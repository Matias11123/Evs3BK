{% extends 'base.html' %}

{% block title %}Confirmar Eliminación - Gol Master{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0 text-center p-4">
            <div class="card-body">
                <i class="bi bi-exclamation-triangle text-warning display-1"></i>
                <h3 class="fw-bold mt-3">¿Confirmar baja lógica?</h3>
                <p class="text-muted">¿Estás seguro de que deseas desactivar la cancha <strong>{{ cancha.nombre }}</strong> ({{ cancha.codigo }})?</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a href="{% url 'canchas:catalogo' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger fw-bold">Sí, Dar de Baja</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
